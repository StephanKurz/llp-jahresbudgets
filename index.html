<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budgetplanung</title>
<style>
  :root {
    --blue: #2f5fa8;
    --border: #d7dce3;
    --bg: #f7f8fa;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #b3261e;
    --ok: #2e7d32;
    --warn: #b8860b;
    --neutral: #9aa1ab;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  #app { max-width: 920px; margin: 0 auto; padding: 22px 20px 40px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  #subtitle { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }

  #hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  #error { color: var(--danger); font-size: 13px; margin-top: 10px; }

  #refresh-row { margin: 0 0 14px; }
  #refresh-btn {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    color: var(--muted); font-size: 11.5px; padding: 4px 9px; cursor: pointer;
  }
  #refresh-btn:hover { color: var(--text); border-color: var(--muted); }
  #refresh-btn:disabled { opacity: 0.6; cursor: default; }
  #refresh-status { font-size: 11.5px; color: var(--muted); margin-left: 8px; }

  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    /* Bewusst KEIN overflow:hidden hier - jeder Vorfahre mit overflow != visible
       bricht position:sticky im thead gegenüber dem echten Viewport. Die runden Ecken
       werden stattdessen direkt auf die äußeren Zellen gelegt (siehe unten). */
  }
  /* table-layout:fixed + colgroup (siehe HTML) - Spaltenbreiten ergeben exakt 100%,
     kein Rest-Platz für eine "leere letzte Spalte". */
  table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th {
    color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .02em;
    background: #fff; position: sticky; top: 0; z-index: 2; box-shadow: 0 1px 0 var(--border);
  }
  thead th:first-child { border-top-left-radius: 8px; }
  thead th:last-child { border-top-right-radius: 8px; }
  tbody tr:last-child td:first-child { border-bottom-left-radius: 8px; }
  tbody tr:last-child td:last-child { border-bottom-right-radius: 8px; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }

  .konto-nr { color: var(--muted); font-variant-numeric: tabular-nums; }

  .budget-display {
    display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end;
    width: 100%;
  }
  .budget-value { font-variant-numeric: tabular-nums; }
  .edit-btn {
    cursor: pointer; background: none; border: none; padding: 2px; color: var(--muted);
    display: inline-flex; align-items: center; vertical-align: middle; flex: none;
  }
  .edit-btn:hover { color: var(--text); }
  .budget-input {
    width: 100px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 13px; text-align: right; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield; appearance: textfield;
  }
  .budget-input:focus { outline: none; border-color: var(--blue); }
  .budget-input::-webkit-outer-spin-button,
  .budget-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* Kein reservierter Platz, solange kein Fehler angezeigt wird - sonst zentriert
     vertical-align:middle den (dann höheren) Zellinhalt und der Wert sitzt zu hoch. */
  .save-feedback { display: block; font-size: 11px; margin-top: 3px; text-align: right; }
  .save-feedback[hidden] { display: none; }
  .save-feedback.err { color: var(--danger); }

  .einnahme-cell { text-align: center; }
  .einnahme-cell input { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }

  .bar-track {
    position: relative; background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; height: 14px; overflow: hidden;
  }
  /* Nur grün/gelb/rot - keine der beiden untenstehenden Verzweigungen lässt bar-fill
     ohne .under/.warn/.over, dieser Default greift also nie, dient nur als Absicherung. */
  .bar-fill { height: 100%; background: var(--neutral); }
  .bar-fill.under { background: var(--ok); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.over { background: var(--danger); }
  .bar-label { font-size: 11px; color: var(--muted); margin-top: 3px; text-align: center; white-space: nowrap; }

  .ampel-cell { text-align: center; }
  .dot {
    display: inline-block; width: 16px; height: 16px; border-radius: 50%;
    vertical-align: middle;
  }
  .dot-green { background: var(--ok); }
  .dot-yellow { background: var(--warn); }
  .dot-red { background: var(--danger); }
  .dot-neutral { background: var(--neutral); }

  #loading { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 9px; }
  #loading[hidden] { display: none; }
  .spinner {
    width: 15px; height: 15px; flex: none;
    border: 2px solid var(--border); border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <h1 id="title">Budgetplanung</h1>
  <div id="subtitle"></div>
  <div id="refresh-row">
    <button id="refresh-btn" type="button" title="Durchsucht den vollen Kontenplan neu (~15-20s) - nötig, wenn ein Konto zum ersten Mal bebucht wurde und hier fehlt.">Konten aktualisieren</button>
    <span id="refresh-status"></span>
  </div>
  <div id="loading"><span class="spinner"></span><span id="loading-text">Lade Kontodaten …</span></div>
  <div id="error" hidden></div>
  <div class="card" id="table-card" hidden>
    <table>
      <colgroup>
        <col style="width:45px">
        <col>
        <col style="width:85px">
        <col style="width:135px">
        <col style="width:95px">
        <col style="width:95px">
        <col style="width:150px">
        <col style="width:95px">
      </colgroup>
      <thead>
        <tr>
          <th>Nr.</th>
          <th>Buchungskonto</th>
          <th class="einnahme-cell" title="Bei Einnahmekonten gilt eine umgekehrte Auslastungs- und Budgetwarnung-Logik.">Einnahme&shy;konto</th>
          <th class="num">Jahresbudget</th>
          <th class="num">Ist (Jahr)</th>
          <th class="num">Soll (Heute)</th>
          <th class="bar-cell">Auslastung</th>
          <th class="ampel-cell">Budgetwarnung</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script>
  const BASE_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1";
  const UEBERSICHT_URL = `${BASE_URL}/budget-uebersicht`;
  const SPEICHERN_URL = `${BASE_URL}/budget-speichern`;
  const AKTUALISIEREN_URL = `${BASE_URL}/konten-aktualisieren`;

  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");
  const loadingEl = document.getElementById("loading");
  const loadingTextEl = document.getElementById("loading-text");
  const errorEl = document.getElementById("error");
  const tableCard = document.getElementById("table-card");
  const tbody = document.getElementById("table-body");
  const refreshBtn = document.getElementById("refresh-btn");
  const refreshStatus = document.getElementById("refresh-status");

  const fmtEUR = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
  const fmtNum = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });

  // Lucide "pencil" (MIT-Lizenz, lucide-icons/lucide) - gleiches Icon wie im Schulreport-Tool
  const PENCIL_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" ' +
    'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 ' +
    '.623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>';

  let currentJahr = null;

  function ampelTitle(ampel, istEinnahmekonto) {
    if (istEinnahmekonto) {
      switch (ampel) {
        case "green": return "Einnahmekonto: Ist erreicht oder übertrifft das Budget.";
        case "red": return "Einnahmekonto: Ist liegt unter dem Budget.";
        default: return "Kein Budget hinterlegt – keine Budgetwarnung möglich.";
      }
    }
    switch (ampel) {
      case "green": return "Im Plan: Ist-Ausgaben liegen unter dem zeitanteiligen Soll.";
      case "yellow": return "Achtung: Ist-Ausgaben liegen bis zu 10 % über dem zeitanteiligen Soll.";
      case "red": return "Warnung: Ist-Ausgaben liegen mehr als 10 % über dem zeitanteiligen Soll.";
      default: return "Kein Budget hinterlegt – keine Budgetwarnung möglich.";
    }
  }

  function renderRow(konto) {
    const tr = document.createElement("tr");
    tr.dataset.nr = konto.nr;

    const tdNr = document.createElement("td");
    tdNr.className = "konto-nr";
    tdNr.textContent = konto.nr;

    const tdName = document.createElement("td");
    tdName.textContent = konto.name;

    const tdEinnahme = document.createElement("td");
    tdEinnahme.className = "einnahme-cell";
    const einnahmeCheckbox = document.createElement("input");
    einnahmeCheckbox.type = "checkbox";
    einnahmeCheckbox.checked = !!konto.istEinnahmekonto;
    einnahmeCheckbox.title = "Einnahmekonto: umgekehrte Auslastungs-/Budgetwarnung-Logik";
    tdEinnahme.appendChild(einnahmeCheckbox);

    const tdBudget = document.createElement("td");
    tdBudget.className = "num budget-cell";
    const feedback = document.createElement("span");
    feedback.className = "save-feedback";
    feedback.hidden = true;

    const tdIst = document.createElement("td");
    tdIst.className = "num";
    tdIst.textContent = fmtEUR.format(konto.actual);

    const tdSoll = document.createElement("td");
    tdSoll.className = "num";

    const tdBar = document.createElement("td");
    tdBar.className = "bar-cell";

    const tdAmpel = document.createElement("td");
    tdAmpel.className = "ampel-cell";

    tr.append(tdNr, tdName, tdEinnahme, tdBudget, tdIst, tdSoll, tdBar, tdAmpel);
    tbody.appendChild(tr);

    const state = { budget: konto.budget, actual: konto.actual, istEinnahmekonto: !!konto.istEinnahmekonto };

    renderBudgetDisplay(tdBudget, feedback, state);
    renderSoll(tdSoll, state);
    renderBarAndAmpel(tdBar, tdAmpel, state);

    einnahmeCheckbox.addEventListener("change", () => {
      state.istEinnahmekonto = einnahmeCheckbox.checked;
      renderBarAndAmpel(tdBar, tdAmpel, state);
      saveBudget(konto.nr, state, feedback, () => {});
    });
  }

  function renderBudgetDisplay(tdBudget, feedback, state) {
    tdBudget.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "budget-display";
    const valueSpan = document.createElement("span");
    valueSpan.className = "budget-value";
    valueSpan.textContent = state.budget === null ? "–" : fmtEUR.format(state.budget);
    const editBtn = document.createElement("button");
    editBtn.className = "edit-btn";
    editBtn.type = "button";
    editBtn.title = "Bearbeiten";
    editBtn.innerHTML = PENCIL_SVG;
    wrap.append(valueSpan, editBtn);
    tdBudget.appendChild(wrap);
    tdBudget.appendChild(feedback);

    editBtn.addEventListener("click", () => renderBudgetEdit(tdBudget, feedback, state));
  }

  function renderBudgetEdit(tdBudget, feedback, state) {
    tdBudget.innerHTML = "";
    const input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.step = "0.01";
    input.className = "budget-input";
    input.value = state.budget === null ? "" : state.budget.toFixed(2);
    input.placeholder = "kein Budget";
    tdBudget.appendChild(input);
    input.focus();
    input.select();

    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      const raw = input.value.trim();
      let value;
      if (raw === "") {
        value = null;
      } else {
        value = parseFloat(raw.replace(",", "."));
        if (isNaN(value) || value < 0) {
          feedback.textContent = "Ungültiger Wert.";
          feedback.className = "save-feedback err";
          feedback.hidden = false;
          renderBudgetDisplay(tdBudget, feedback, state);
          return;
        }
      }
      state.budget = value;
      renderBudgetDisplay(tdBudget, feedback, state);
      const tr = tdBudget.closest("tr");
      const tdBar = tr.querySelector(".bar-cell");
      const tdAmpel = tdBar.nextElementSibling;
      const tdSoll = tdBar.previousElementSibling;
      renderSoll(tdSoll, state);
      renderBarAndAmpel(tdBar, tdAmpel, state);
      saveBudget(Number(tr.dataset.nr), state, feedback, () => {});
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") input.blur();
      if (e.key === "Escape") { done = true; renderBudgetDisplay(tdBudget, feedback, state); }
    });
  }

  function computeSollHeute(budget) {
    if (budget === null) return null;
    const now = new Date();
    const start = new Date(Date.UTC(now.getUTCFullYear(), 0, 1));
    const tag = Math.floor((now.getTime() - start.getTime()) / 86400000) + 1;
    const tageGesamt = (new Date(Date.UTC(now.getUTCFullYear(), 1, 29)).getUTCMonth() === 1) ? 366 : 365;
    return budget * (tag / tageGesamt);
  }

  function renderSoll(tdSoll, state) {
    const sollHeute = computeSollHeute(state.budget);
    tdSoll.textContent = sollHeute === null ? "–" : fmtEUR.format(sollHeute);
  }

  function renderBarAndAmpel(tdBar, tdAmpel, state) {
    if (state.budget === null) {
      tdBar.innerHTML = `<div class="bar-track"></div><div class="bar-label">kein Budget hinterlegt</div>`;
    } else {
      // Bei explizit auf 0 gesetztem Budget ist jeder Ist-Betrag > 0 "unendlich" über Budget.
      const prozent = state.budget > 0 ? (state.actual / state.budget) * 100 : (state.actual > 0 ? Infinity : 0);
      const width = Math.min(prozent, 100);
      let fillClass;
      if (state.istEinnahmekonto) {
        // Umgekehrte Logik: hohe Auslastung = gut (Einnahmeziel erreicht/übertroffen).
        fillClass = prozent <= 80 ? " over" : prozent < 100 ? " warn" : " under";
      } else {
        // Nur grün/gelb/rot - kein Blau (Default) für die 80-100%-Zone.
        fillClass = prozent > 100 ? " over" : prozent < 80 ? " under" : " warn";
      }
      const label = Number.isFinite(prozent) ? `${fmtNum.format(Math.round(prozent))} %` : "∞ %";
      tdBar.innerHTML =
        `<div class="bar-track"><div class="bar-fill${fillClass}" style="width:${width}%"></div></div>` +
        `<div class="bar-label">${label}</div>`;
    }

    const ampel = computeAmpel(state.budget, state.actual, state.istEinnahmekonto);
    tdAmpel.innerHTML = `<span class="dot dot-${ampel || "neutral"}"></span>`;
    tdAmpel.title = ampelTitle(ampel, state.istEinnahmekonto);
  }

  function computeAmpel(budget, actual, istEinnahmekonto) {
    if (budget === null) return null;
    if (istEinnahmekonto) {
      return actual >= budget ? "green" : "red";
    }
    const now = new Date();
    const start = new Date(Date.UTC(now.getUTCFullYear(), 0, 1));
    const tag = Math.floor((now.getTime() - start.getTime()) / 86400000) + 1;
    const tageGesamt = (new Date(Date.UTC(now.getUTCFullYear(), 1, 29)).getUTCMonth() === 1) ? 366 : 365;
    const prorated = budget * (tag / tageGesamt);
    if (actual < prorated) return "green";
    if (actual <= prorated * 1.10) return "yellow";
    return "red";
  }

  async function saveBudget(nr, state, feedback, onDone) {
    // Speichern läuft bewusst ohne Erfolgsmeldung (kein "Gespeichert."-Text) - nur ein
    // tatsächlicher Fehler wird angezeigt. feedback bleibt hidden, solange nichts schiefgeht,
    // damit kein reservierter Platz die Zeile in die Höhe zieht.
    try {
      const resp = await fetch(SPEICHERN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          konto_nr: nr,
          jahr: currentJahr,
          budget: state.budget,
          ist_einnahmekonto: state.istEinnahmekonto,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");

      feedback.hidden = true;
      feedback.textContent = "";
      onDone(true);
    } catch (e) {
      feedback.textContent = "Fehler: " + e.message;
      feedback.className = "save-feedback err";
      feedback.hidden = false;
      onDone(false);
    }
  }

  async function load() {
    const startedAt = Date.now();
    const tick = () => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      loadingTextEl.textContent = `Lade Kontodaten … ${s} s`;
    };
    tick();
    const timer = setInterval(tick, 1000);

    try {
      const resp = await fetch(UEBERSICHT_URL);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");

      currentJahr = data.jahr;
      titleEl.textContent = `Budgetplanung ${data.jahr}`;
      subtitleEl.textContent = `Stand: ${new Date(data.heute).toLocaleDateString("de-DE")}`;

      if (data.konten.length === 0) {
        clearInterval(timer);
        loadingEl.querySelector(".spinner").remove();
        loadingTextEl.textContent = `Keine Buchungen für ${data.jahr} gefunden.`;
        return;
      }

      for (const konto of data.konten) renderRow(konto);

      clearInterval(timer);
      loadingEl.hidden = true;
      loadingEl.style.display = "none";
      tableCard.hidden = false;
    } catch (e) {
      clearInterval(timer);
      loadingEl.hidden = true;
      loadingEl.style.display = "none";
      errorEl.textContent = "Fehler beim Laden: " + e.message;
      errorEl.hidden = false;
    }
  }

  refreshBtn.addEventListener("click", async () => {
    refreshBtn.disabled = true;
    refreshStatus.textContent = "Durchsuche vollen Kontenplan … (kann bis zu 20 s dauern)";
    try {
      const resp = await fetch(AKTUALISIEREN_URL, { method: "POST" });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");

      refreshStatus.textContent = `${data.kontenGefunden} Konten gefunden. Lade Übersicht neu …`;
      tbody.innerHTML = "";
      tableCard.hidden = true;
      loadingEl.hidden = false;
      loadingEl.style.display = "";
      errorEl.hidden = true;
      await load();
      refreshStatus.textContent = "";
    } catch (e) {
      refreshStatus.textContent = "Fehler: " + e.message;
    } finally {
      refreshBtn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
